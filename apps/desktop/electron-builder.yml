appId: app.musefocus.desktop
productName: MuseFocus
artifactName: MuseFocus-${version}-${arch}.${ext}

directories:
  buildResources: resources
  output: dist

files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - node_modules/@muse-code/sdk/**/*

extraResources:
  - from: resources/branding/icon.png
    to: branding/icon.png
  - from: ../../services/voice/dist/metahackathon-voice
    to: voice

asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
  - "out/main/db/migrations/**/*"

npmRebuild: true
forceCodeSigning: true
beforePack: packaging/before-pack.cjs
afterPack: packaging/after-pack.cjs
afterSign: packaging/after-sign.cjs

publish:
  provider: github
  owner: VrolixThomas
  repo: MetaHackathon
  releaseType: draft

mac:
  icon: resources/branding/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Start a hands-free voice conversation with MuseFocus. End the session to stop listening.
  target:
    - dmg
    - zip

dmg:
  sign: true

win:
  icon: resources/branding/icon.ico

linux:
  icon: resources/branding/icon.png
