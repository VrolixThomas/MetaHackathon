name: Team database and sharing API
on:
  pull_request:
    paths:
      - "supabase/**"
      - "services/team/**"
      - "apps/desktop/src/main/team/**"
      - "apps/desktop/src/shared/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/team-database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "services/team/**"
      - "apps/desktop/src/main/team/**"
      - "apps/desktop/src/shared/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/team-database.yml"
permissions:
  contents: read
jobs:
  row-level-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply versioned migrations and check tenant isolation
        run: bash services/team/test-sql.sh
  edge-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test services/team apps/desktop/src/main/team
      - run: >-
          bunx --no-install tsc --noEmit --target ES2022 --module ESNext
          --moduleResolution bundler --esModuleInterop --strict --skipLibCheck
          --types node --lib ES2022,DOM,DOM.Iterable services/team/*.ts services/team/edge/*.ts
      - run: bun run team:edge:build
